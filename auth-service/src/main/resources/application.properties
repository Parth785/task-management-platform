spring.application.name=auth-service

server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_platform}?currentSchema=authdb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=authdb

spring.flyway.enabled=true
spring.flyway.schemas=authdb
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=authdb
spring.flyway.create-schemas=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packagesToScan=com.tmp.authservice


jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-minimum-256-bits}
jwt.expiration.ms=${JWT_EXPIRY_MS:86400000}