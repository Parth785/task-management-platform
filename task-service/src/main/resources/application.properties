spring.application.name=task-service


server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_platform}?currentSchema=taskdb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=taskdb

jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-minimum-256-bits}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}